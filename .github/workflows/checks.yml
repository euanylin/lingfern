name: Checks

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run release:files -- /tmp/lingfern-source-export
      - run: npm run build
      - name: Inspect public build
        run: |
          test -f dist/index.html && test -f dist/sw.js
          test -z "$(find dist -type f -size +20M -print -quit)"
          du -sh dist
      - run: npm run deploy:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:sync
      - run: npm run test:mcp
      - run: npm run test:e2e
      - run: npm run test:offline
      - run: npm run test:update
      - name: Check local Worker routes and assets
        run: |
          set -euo pipefail
          npm run preview > /tmp/lingfern-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/sw.js > /dev/null; then
              npm run test:worker
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lingfern-preview.log
          exit 1
