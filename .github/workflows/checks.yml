name: Fork isolation probe

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  fork-secret-probe:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'euanyxlin/lingfern-ci-isolation-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check secret availability without exposing values
        env:
          CI_TOKEN_AVAILABLE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CI_ACCOUNT_AVAILABLE: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          test "$CI_TOKEN_AVAILABLE" = false
          test "$CI_ACCOUNT_AVAILABLE" = false

  production-denial-probe:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'euanyxlin/lingfern-ci-isolation-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    steps:
      - name: Fail if the protected environment unexpectedly starts this job
        run: exit 1
