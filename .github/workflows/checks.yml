name: Checks

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Reuse verification for the identical source
        id: verification
        run: node scripts/ci-verification.mjs --reuse
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm ci
        if: steps.verification.outputs.run_id == ''
      - run: npm run lint
        if: steps.verification.outputs.run_id == ''
      - run: npm test
        if: steps.verification.outputs.run_id == ''
      - run: npm run release:files -- /tmp/lingfern-source-export
        if: steps.verification.outputs.run_id == ''
      - run: npm run build
        if: steps.verification.outputs.run_id == ''
      - name: Inspect public build
        if: steps.verification.outputs.run_id == ''
        run: |
          test -f dist/index.html && test -f dist/sw.js
          test -z "$(find dist -type f -size +20M -print -quit)"
          du -sh dist
      - run: npm run deploy:check
        if: steps.verification.outputs.run_id == ''
      - run: npx playwright install --with-deps chromium
        if: steps.verification.outputs.run_id == ''
      - run: npm run test:sync
        if: steps.verification.outputs.run_id == ''
      - run: npm run test:mcp
        if: steps.verification.outputs.run_id == ''
      - run: npm run test:e2e
        if: steps.verification.outputs.run_id == ''
      - run: npm run test:offline
        if: steps.verification.outputs.run_id == ''
      - run: npm run test:update
        if: steps.verification.outputs.run_id == ''
        timeout-minutes: 5
      - name: Check local Worker routes and assets
        if: steps.verification.outputs.run_id == ''
        run: |
          set -euo pipefail
          npm run preview > /tmp/lingfern-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/sw.js > /dev/null; then
              npm run test:worker
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lingfern-preview.log
          exit 1
