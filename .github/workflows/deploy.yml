name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type deploy-lingfern to deploy the main branch
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'deploy-lingfern'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: lingfern-production
      cancel-in-progress: false
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Require verified source on protected main
        id: verification
        run: node scripts/ci-verification.mjs --require-main
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Documentation needs no website deployment
        if: steps.verification.outputs.scope == 'docs'
        run: echo 'Verified documentation only; no build, upload or traffic change.'
      - run: npm ci
        if: steps.verification.outputs.scope != 'docs'
      - name: Check public source
        if: steps.verification.outputs.scope != 'docs'
        run: node scripts/release-files.mjs --check
      - run: npm run build
        if: steps.verification.outputs.scope != 'docs'
      - name: Inspect public build
        if: steps.verification.outputs.scope != 'docs'
        run: |
          test -f dist/index.html && test -f dist/sw.js
          test -z "$(find dist -type f -size +20M -print -quit)"
          du -sh dist
      - run: npm run deploy:check
        if: steps.verification.outputs.scope != 'docs'
      - name: Check local Worker routes and assets
        if: steps.verification.outputs.scope != 'docs'
        run: |
          set -euo pipefail
          npm run preview > /tmp/lingfern-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/sw.js > /dev/null; then
              npm run test:worker
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lingfern-preview.log
          exit 1
      - name: Require configured first-launch integrations
        if: steps.verification.outputs.scope != 'docs'
        run: node scripts/release-config.mjs --ci /tmp/lingfern-ci-deployment.json
      - name: Deploy the checked source and assets
        if: steps.verification.outputs.scope != 'docs'
        run: node scripts/deploy-verified.mjs /tmp/lingfern-ci-deployment.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Retain public deployment evidence
        if: always() && steps.verification.outputs.scope != 'docs'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-evidence-${{ github.run_id }}
          path: |
            /tmp/lingfern-deployment-assets.json
            /tmp/lingfern-deployment-journal.json
          if-no-files-found: ignore
          retention-days: 14
